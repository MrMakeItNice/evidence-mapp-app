name: Offline Case Source Coverage
on:
  pull_request:
    paths:
      - 'scripts/audit-case-source-coverage.mjs'
      - 'tests/audit-case-source-coverage.test.mjs'
      - '.github/workflows/offline-case-source-coverage.yml'
permissions:
  contents: read
jobs:
  review-only-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/audit-case-source-coverage.mjs
      - run: node --check tests/audit-case-source-coverage.test.mjs
      - run: node --test tests/audit-case-source-coverage.test.mjs
