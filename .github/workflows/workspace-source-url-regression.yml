name: Workspace provenance URL regression

on:
  pull_request:
    paths:
      - 'workspace.html'
      - 'tests/workspace-source-url.test.cjs'
      - '.github/workflows/workspace-source-url-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-source-url:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace source-link safety and script syntax
        run: node --test tests/workspace-source-url.test.cjs
