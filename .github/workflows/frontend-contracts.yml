name: Frontend contract checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-contracts:
    name: Node syntax and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript test syntax and run available contracts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.test.mjs tests/*.test.cjs tests/*.test.js)
          if (( ${#tests[@]} == 0 )); then
            echo "No Node contract tests on this branch; nothing to run."
            exit 0
          fi
          for test_file in "${tests[@]}"; do
            node --check "$test_file"
          done
          node --test "${tests[@]}"
