name: Source metadata triage (offline regression)
on:
  pull_request:
    paths:
      - 'scripts/audit-source-publication-metadata.mjs'
      - 'tests/audit-source-publication-metadata.test.mjs'
      - '.github/workflows/source-publication-metadata-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and offline regression tests
        run: |
          node --check scripts/audit-source-publication-metadata.mjs
          node --check tests/audit-source-publication-metadata.test.mjs
          node --test tests/audit-source-publication-metadata.test.mjs
