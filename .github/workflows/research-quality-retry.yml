name: Research quality recovery checks
on:
  pull_request:
    paths:
      - 'research-quality.html'
      - 'tests/research-quality-retry.test.cjs'
      - '.github/workflows/research-quality-retry.yml'
  workflow_dispatch:
jobs:
  recovery-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Research Quality recovery tests
        run: node --test tests/research-quality-retry.test.cjs
