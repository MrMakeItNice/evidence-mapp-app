name: Offline News Ingestion Audit
on:
  pull_request:
    paths:
      - 'scripts/audit-news-ingestion.mjs'
      - 'tests/audit-news-ingestion.test.mjs'
      - '.github/workflows/offline-news-ingestion-audit.yml'
permissions:
  contents: read
jobs:
  review-only-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/audit-news-ingestion.mjs
      - run: node --check tests/audit-news-ingestion.test.mjs
      - run: node --test tests/audit-news-ingestion.test.mjs
