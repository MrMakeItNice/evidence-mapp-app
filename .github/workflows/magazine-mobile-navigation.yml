name: Magazine mobile navigation QA
on:
  pull_request:
    paths:
      - investigation-reader.html
      - tests/magazine-mobile-navigation.test.cjs
      - .github/workflows/magazine-mobile-navigation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check magazine mobile navigation structure
        run: node --test tests/magazine-mobile-navigation.test.cjs
