name: Evidence Board source URL regression

on:
  push:
    branches:
      - main
    paths:
      - 'evidence-board.html'
      - 'tests/evidence-board-source-url.test.cjs'
      - '.github/workflows/evidence-board-source-url-regression.yml'
  pull_request:
    paths:
      - 'evidence-board.html'
      - 'tests/evidence-board-source-url.test.cjs'
      - '.github/workflows/evidence-board-source-url-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-url-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run source URL regression tests
        run: node --test tests/evidence-board-source-url.test.cjs
