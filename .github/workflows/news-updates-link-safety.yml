name: News Updates link safety

on:
  pull_request:
    paths:
      - 'news-updates.js'
      - 'tests/news-updates-link-safety.test.cjs'
      - '.github/workflows/news-updates-link-safety.yml'
  push:
    branches: [main]
    paths:
      - 'news-updates.js'
      - 'tests/news-updates-link-safety.test.cjs'
      - '.github/workflows/news-updates-link-safety.yml'

permissions:
  contents: read

jobs:
  source-link-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate news source links
        run: node --test tests/news-updates-link-safety.test.cjs
